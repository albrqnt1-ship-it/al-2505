<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استراحة البرق نت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 4em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.3em;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 12px;
            border-right: 4px solid #4FC3F7;
            text-align: right;
        }
        
        .feature-icon {
            font-size: 1.5em;
            margin-bottom: 8px;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn {
            background: linear-gradient(45deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #4FC3F7, #29B6F6);
            box-shadow: 0 4px 15px rgba(79, 195, 247, 0.4);
        }
        
        .status {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        
        .server-info {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            direction: ltr;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌩️</div>
        
        <h1>أهلاً بك في استراحة البرق نت</h1>
        
        <p class="subtitle">
            تطبيق ويب محلي يعمل بدون إنترنت<br>
            مصمم خصيصاً للشبكات الداخلية
        </p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <div>أداء سريع</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div>آمن ومحمي</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div>متوافق مع الجوال</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div>بدون إنترنت</div>
            </div>
        </div>
        
        <div class="status">
            <strong>حالة الخادم:</strong>
            <div class="server-info" id="serverStatus">جاري التحقق...</div>
        </div>
        
        <div class="buttons">
            <button class="btn" onclick="testConnection()">فحص الاتصال</button>
            <button class="btn btn-secondary" onclick="showInfo()">معلومات التطبيق</button>
        </div>
        
        <div style="margin-top: 25px; font-size: 0.9em; opacity: 0.8;">
            ⚡ تم التطوير بواسطة نايف - إصدار 1.0.0
        </div>
    </div>

    <script>
        function testConnection() {
            const statusElement = document.getElementById('serverStatus');
            statusElement.innerHTML = 'جاري فحص الخادم المحلي...';
            statusElement.style.borderLeftColor = '#FFA000';
            
            // محاولة الاتصال بالخادم المحلي
            fetch('http://192.168.21.90')
                .then(response => {
                    statusElement.innerHTML = '✅ الخادم يعمل بشكل طبيعي';
                    statusElement.style.borderLeftColor = '#4CAF50';
                })
                .catch(error => {
                    statusElement.innerHTML = '⚠️ لا يمكن الوصول للخادم المحلي';
                    statusElement.style.borderLeftColor = '#F44336';
                });
        }
        
        function showInfo() {
            const info = `
                🌩️ استراحة البرق نت
                
                الإصدار: 1.0.0
                الخادم: 192.168.21.90
                النوع: تطبيق ويب محلي
                المطور: نايف
                
                ⚡ يعمل بدون اتصال بالإنترنت
            `;
            alert(info);
        }
        
        // فحص تلقائي عند التحميل
        window.addEventListener('load', function() {
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
