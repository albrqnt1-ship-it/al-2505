workflows:
  android-workflow:
    name: Build Android APK
    environment:
      vars:
        PACKAGE_NAME: "com.naif.istirahat_albarq"
    scripts:
      - name: Fix Flutter project structure
        script: |
          echo "🔄 إصلاح هيكل مشروع Flutter..."
          flutter create --org com.naif --project-name istirahat_albarq .
      - name: Install dependencies
        script: |
          echo "📦 تثبيت dependencies..."
          flutter pub get
      - name: Build Android APK
        script: |
          echo "🏗️ بناء APK..."
          flutter build apk --release
          echo "✅ البناء اكتمل!"
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
    publishing:
      email:
        recipients:
          - nayfalhetar0@gmail.com
