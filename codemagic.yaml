workflows:
  android-workflow:
    name: Build Android APK
    environment:
      vars:
        PACKAGE_NAME: "com.naif.istirahat_albarq"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
